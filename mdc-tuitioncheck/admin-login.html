<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Login — MDC TuitionCheck & Pay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0A2540, #1a4a7a);
            min-height: 100vh;
        }

        .fw {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box {
            background: #fff;
            padding: 35px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 460px;
            border-top: 6px solid #F5B301;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #F5B301;
            background: #fff;
            padding: 4px;
            display: inline-block;
            box-shadow: 0 6px 20px rgba(10, 37, 64, 0.2);
        }

        .box h1 {
            color: #0A2540;
            text-align: center;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .box .sub {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .box .school {
            text-align: center;
            color: #F5B301;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 22px;
        }

        .fg {
            margin-bottom: 14px;
        }

        .fg label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #0A2540;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fg input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .fg input:focus {
            border-color: #F5B301;
            outline: none;
            box-shadow: 0 0 0 3px rgba(245, 179, 1, 0.2);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #F5B301, #d99d00);
            color: #0A2540;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: linear-gradient(135deg, #d99d00, #b38000);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .alert-error {
            background: #fee;
            color: #c00;
            border-left: 4px solid #c00;
        }

        .note {
            background: #fff9e6;
            border-left: 3px solid #F5B301;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }

        .back {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .back a {
            color: #0A2540;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #F5B301;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="fw">
        <div class="box">
            <div class="logo">
                <img src="https://media.licdn.com/dms/image/v2/C4E0BAQE1Z81q2ErnPg/company-logo_200_200/company-logo_200_200/0/1630578654224?e=2147483647&v=beta&t=KgUkDCDFdeYnwkhGLC_SEGQ4lUGqd6qHWh8_6K8hBYo" class="logo-img">
            </div>
            <h1>Cashier / Admin Login</h1>
            <p class="sub">Tuition Monitoring System</p>
            <p class="school">Metro Dumaguete College</p>

            <div id="alertBox"></div>

            <form onsubmit="handleLogin(event)">
                <div class="fg">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="fg">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Log In</button>
            </form>

            <div class="note">
                🔑 Demo credentials: <strong>admin</strong> / <strong>admin123</strong>
            </div>

            <p class="back">
                <a href="index.html">← Back to Home</a>
            </p>
        </div>
    </div>

    <script>
        const DB = {
            init() {
                if (!localStorage.getItem('mdc_admins')) {
                    localStorage.setItem('mdc_admins', JSON.stringify([{
                        id: 1,
                        username: 'admin',
                        password: 'admin123',
                        full_name: 'MDC Cashier'
                    }]));
                }
            },
            getAdmins() {
                return JSON.parse(localStorage.getItem('mdc_admins') || '[]');
            }
        };

        DB.init();

        function showAlert(m) {
            document.getElementById('alertBox').innerHTML = `<div class="alert alert-error">${m}</div>`;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const admin = DB.getAdmins().find(a => a.username === username);

            if (!admin) {
                showAlert('Username not found.');
                return;
            }
            if (admin.password !== password) {
                showAlert('Incorrect password.');
                return;
            }

            sessionStorage.setItem('mdc_role', 'admin');
            sessionStorage.setItem('mdc_user', JSON.stringify({
                id: admin.id,
                username: admin.username,
                name: admin.full_name
            }));
            location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
