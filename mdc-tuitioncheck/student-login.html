<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — MDC TuitionCheck & Pay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0A2540, #1a4a7a);
            min-height: 100vh;
        }

        .fw {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box {
            background: #fff;
            padding: 35px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 460px;
            border-top: 6px solid #F5B301;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #F5B301;
            background: #fff;
            padding: 4px;
            display: inline-block;
            box-shadow: 0 6px 20px rgba(10, 37, 64, 0.2);
        }

        .box h1 {
            color: #0A2540;
            text-align: center;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .box .sub {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .box .school {
            text-align: center;
            color: #F5B301;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 22px;
        }

        .fg {
            margin-bottom: 14px;
        }

        .fg label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #0A2540;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fg input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .fg input:focus {
            border-color: #F5B301;
            outline: none;
            box-shadow: 0 0 0 3px rgba(245, 179, 1, 0.2);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #F5B301, #d99d00);
            color: #0A2540;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: linear-gradient(135deg, #d99d00, #b38000);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .alert-error {
            background: #fee;
            color: #c00;
            border-left: 4px solid #c00;
        }

        .back {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .back a {
            color: #0A2540;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #F5B301;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="fw">
        <div class="box">
            <div class="logo">
                <img src="https://media.licdn.com/dms/image/v2/C4E0BAQE1Z81q2ErnPg/company-logo_200_200/company-logo_200_200/0/1630578654224?e=2147483647&v=beta&t=KgUkDCDFdeYnwkhGLC_SEGQ4lUGqd6qHWh8_6K8hBYo" class="logo-img">
            </div>
            <h1>Student Login</h1>
            <p class="sub">Student Portal</p>
            <p class="school">Metro Dumaguete College</p>

            <div id="alertBox"></div>

            <form onsubmit="handleLogin(event)">
                <div class="fg">
                    <label>MDC Email</label>
                    <input type="email" id="email" placeholder="firstname.lastname@mdci.edu.ph" required>
                </div>
                <div class="fg">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Log In</button>
            </form>

            <p class="back">
                <a href="student-signup.html">Create an account</a> · <a href="index.html">Back to Home</a>
            </p>
        </div>
    </div>

    <script>
        const DB = {
            init() {
                if (!localStorage.getItem('mdc_admins')) {
                    localStorage.setItem('mdc_admins', JSON.stringify([{
                        id: 1,
                        username: 'admin',
                        password: 'admin123',
                        full_name: 'MDC Cashier'
                    }]));
                }
                if (!localStorage.getItem('mdc_students')) localStorage.setItem('mdc_students', '[]');
                if (!localStorage.getItem('mdc_balances')) localStorage.setItem('mdc_balances', '[]');
                if (!localStorage.getItem('mdc_payments')) localStorage.setItem('mdc_payments', '[]');
            },
            getStudents() {
                return JSON.parse(localStorage.getItem('mdc_students') || '[]');
            },
            saveStudents(l) {
                localStorage.setItem('mdc_students', JSON.stringify(l));
            },
            findStudentByEmail(e) {
                return this.getStudents().find(s => s.email.toLowerCase() === e.toLowerCase());
            },
            addStudent(s) {
                const l = this.getStudents();
                s.id = l.length ? Math.max(...l.map(x => x.id)) + 1 : 1;
                l.push(s);
                this.saveStudents(l);
                return s;
            },
            updateStudent(id, c) {
                const l = this.getStudents();
                const i = l.findIndex(s => s.id === id);
                if (i >= 0) {
                    l[i] = { ...l[i], ...c };
                    this.saveStudents(l);
                }
            },
            getAdmins() {
                return JSON.parse(localStorage.getItem('mdc_admins') || '[]');
            },
            getBalances() {
                return JSON.parse(localStorage.getItem('mdc_balances') || '[]');
            },
            saveBalances(l) {
                localStorage.setItem('mdc_balances', JSON.stringify(l));
            },
            getBalanceForStudent(sid) {
                const l = this.getBalances().filter(b => b.student_id === sid);
                return l.length ? l[l.length - 1] : null;
            },
            addBalance(b) {
                const l = this.getBalances();
                b.id = l.length ? Math.max(...l.map(x => x.id)) + 1 : 1;
                l.push(b);
                this.saveBalances(l);
                return b;
            },
            updateBalance(id, c) {
                const l = this.getBalances();
                const i = l.findIndex(b => b.id === id);
                if (i >= 0) {
                    l[i] = { ...l[i], ...c };
                    this.saveBalances(l);
                }
            },
            getPayments() {
                return JSON.parse(localStorage.getItem('mdc_payments') || '[]');
            },
            addPayment(p) {
                const l = this.getPayments();
                p.id = l.length ? Math.max(...l.map(x => x.id)) + 1 : 1;
                l.push(p);
                localStorage.setItem('mdc_payments', JSON.stringify(l));
                return p;
            },
            getPaymentsForStudent(sid) {
                return this.getPayments().filter(p => p.student_id === sid);
            },
            getPaymentById(id) {
                return this.getPayments().find(p => p.id === parseInt(id));
            }
        };

        DB.init();

        const ALLOWED_DOMAIN = 'mdci.edu.ph';

        const Auth = {
            validateDomain(e) {
                const d = e.split('@')[1];
                return d && d.toLowerCase() === ALLOWED_DOMAIN;
            },
            generateOTP() {
                return String(Math.floor(100000 + Math.random() * 900000));
            },
            generateRef() {
                const d = new Date();
                const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
                return `MDC-${ymd}-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
            },
            setSession(role, data) {
                sessionStorage.setItem('mdc_role', role);
                sessionStorage.setItem('mdc_user', JSON.stringify(data));
            },
            getSession() {
                const r = sessionStorage.getItem('mdc_role');
                const u = sessionStorage.getItem('mdc_user');
                return r && u ? { role: r, user: JSON.parse(u) } : null;
            },
            logout() {
                sessionStorage.clear();
                location.href = 'index.html';
            },
            money(n) {
                return '₱' + Number(n).toLocaleString('en-PH', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            },
            date(iso) {
                const d = new Date(iso);
                return d.toLocaleDateString('en-PH', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }) + ' ' + d.toLocaleTimeString('en-PH', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
        };

        function showAlert(m) {
            document.getElementById('alertBox').innerHTML = `<div class="alert alert-error">${m}</div>`;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!Auth.validateDomain(email)) {
                showAlert('⚠️ Only @mdci.edu.ph email addresses are allowed.');
                return;
            }

            const student = DB.findStudentByEmail(email);
            if (!student) {
                showAlert('No account found. Please sign up.');
                return;
            }
            if (student.password !== password) {
                showAlert('Incorrect password.');
                return;
            }
            if (!student.is_verified) {
                sessionStorage.setItem('mdc_otp_email', email);
                sessionStorage.setItem('mdc_otp_code', student.otp_code);
                location.href = 'verify-otp.html';
                return;
            }

            Auth.setSession('student', {
                id: student.id,
                student_id: student.student_id,
                email: student.email,
                name: student.first_name + ' ' + student.last_name,
                course: student.course,
                year_level: student.year_level,
                school_year: student.school_year
            });

            location.href = 'student-dashboard.html';
        }
    </script>
</body>
</html>
