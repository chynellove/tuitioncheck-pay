<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — MDC TuitionCheck & Pay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0A2540, #1a4a7a);
            min-height: 100vh;
        }

        .fw {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box {
            background: #fff;
            padding: 35px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 460px;
            border-top: 6px solid #F5B301;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #F5B301;
            background: #fff;
            padding: 4px;
            display: inline-block;
            box-shadow: 0 6px 20px rgba(10, 37, 64, 0.2);
        }

        .box h1 {
            color: #0A2540;
            text-align: center;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .box .sub {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .box .school {
            text-align: center;
            color: #F5B301;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 22px;
        }

        .fg {
            margin-bottom: 14px;
        }

        .fg label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #0A2540;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fg input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 24px;
            letter-spacing: 8px;
            font-weight: 700;
            text-align: center;
        }

        .fg input:focus {
            border-color: #F5B301;
            outline: none;
            box-shadow: 0 0 0 3px rgba(245, 179, 1, 0.2);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #F5B301, #d99d00);
            color: #0A2540;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: linear-gradient(135deg, #d99d00, #b38000);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .alert-error {
            background: #fee;
            color: #c00;
            border-left: 4px solid #c00;
        }

        .alert-info {
            background: #e7f3ff;
            color: #004085;
            border-left: 4px solid #004085;
        }

        .back {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .back a {
            color: #0A2540;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #F5B301;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="fw">
        <div class="box">
            <div class="logo">
                <img src="https://media.licdn.com/dms/image/v2/C4E0BAQE1Z81q2ErnPg/company-logo_200_200/company-logo_200_200/0/1630578654224?e=2147483647&v=beta&t=KgUkDCDFdeYnwkhGLC_SEGQ4lUGqd6qHWh8_6K8hBYo" class="logo-img">
            </div>
            <h1>Verify Your Account</h1>
            <p class="sub">Enter the 6-digit code</p>
            <p class="school">Metro Dumaguete College</p>

            <div id="otpDisplay"></div>
            <div id="alertBox"></div>

            <form onsubmit="handleVerify(event)">
                <div class="fg">
                    <label>OTP Code</label>
                    <input type="text" id="otp" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="000000" required>
                </div>
                <button type="submit" class="btn">Verify Account</button>
            </form>

            <p class="back">
                <a href="#" onclick="resendOTP(event)">Resend OTP</a> · <a href="student-login.html">Back to Login</a>
            </p>
        </div>
    </div>

    <script>
        const DB = {
            getStudents() {
                return JSON.parse(localStorage.getItem('mdc_students') || '[]');
            },
            saveStudents(l) {
                localStorage.setItem('mdc_students', JSON.stringify(l));
            },
            findStudentByEmail(e) {
                return this.getStudents().find(s => s.email.toLowerCase() === e.toLowerCase());
            },
            updateStudent(id, c) {
                const l = this.getStudents();
                const i = l.findIndex(s => s.id === id);
                if (i >= 0) {
                    l[i] = { ...l[i], ...c };
                    this.saveStudents(l);
                }
            }
        };

        function generateOTP() {
            return String(Math.floor(100000 + Math.random() * 900000));
        }

        function setSession(role, data) {
            sessionStorage.setItem('mdc_role', role);
            sessionStorage.setItem('mdc_user', JSON.stringify(data));
        }

        const email = sessionStorage.getItem('mdc_otp_email');
        const otpCode = sessionStorage.getItem('mdc_otp_code');

        if (!email || !otpCode) {
            location.href = 'student-login.html';
        }

        document.getElementById('otpDisplay').innerHTML = `
            <div class="alert alert-info">
                📧 <strong>DEMO MODE:</strong> Your OTP for <strong>${email}</strong> is
                <strong style="font-size:20px;letter-spacing:4px;">${otpCode}</strong>
                <br><small>(In production, this would be emailed.)</small>
            </div>
        `;

        function handleVerify(e) {
            e.preventDefault();
            const input = document.getElementById('otp').value.trim();
            const student = DB.findStudentByEmail(email);

            if (!student) {
                alert('Account not found.');
                return;
            }
            if (input !== student.otp_code) {
                document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">❌ Invalid OTP. Please try again.</div>';
                return;
            }

            DB.updateStudent(student.id, { is_verified: true, otp_code: null });

            setSession('student', {
                id: student.id,
                student_id: student.student_id,
                email: student.email,
                name: student.first_name + ' ' + student.last_name,
                course: student.course,
                year_level: student.year_level,
                school_year: student.school_year
            });

            sessionStorage.removeItem('mdc_otp_email');
            sessionStorage.removeItem('mdc_otp_code');

            alert('✅ Account verified! Welcome to MDC TuitionCheck & Pay.');
            location.href = 'student-dashboard.html';
        }

        function resendOTP(e) {
            e.preventDefault();
            const student = DB.findStudentByEmail(email);
            const newOTP = generateOTP();
            DB.updateStudent(student.id, { otp_code: newOTP });
            sessionStorage.setItem('mdc_otp_code', newOTP);
            document.getElementById('otpDisplay').innerHTML = `
                <div class="alert alert-info">
                    📧 <strong>DEMO MODE:</strong> New OTP for <strong>${email}</strong> is
                    <strong style="font-size:20px;letter-spacing:4px;">${newOTP}</strong>
                </div>
            `;
        }
    </script>
</body>
</html>
